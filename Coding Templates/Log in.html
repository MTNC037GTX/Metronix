<style type='text/tailwindcss'>
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .bg-gradient-brand {
                background: linear-gradient(135deg, #575AD0 0%, #8A8CD9 100%);
            }
            .text-gradient {
                background-clip: text;
                -webkit-background-clip: text;
                color: transparent;
                background-image: linear-gradient(90deg, #575AD0, #8A8CD9);
            }
            .bg-glass {
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
            }
            .animate-float {
                animation: float 6s ease-in-out infinite;
            }
            .animate-float-delay-1 {
                animation: float 6s ease-in-out 1s infinite;
            }
            .animate-float-delay-2 {
                animation: float 6s ease-in-out 2s infinite;
            }
            @keyframes float {
                0% { transform: translateY(0px); }
                50% { transform: translateY(-20px); }
                100% { transform: translateY(0px); }
            }
            .animate-fade-in {
                animation: fadeIn 0.8s ease-out forwards;
            }
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }
            .animate-card-rise {
                animation: cardRise 0.6s ease-out forwards;
            }
            @keyframes cardRise {
                from { opacity: 0; transform: translateY(20px); box-shadow: 0 0 0 rgba(87, 90, 208, 0); }
                to { opacity: 1; transform: translateY(0); box-shadow: 0 10px 30px -5px rgba(87, 90, 208, 0.15); }
            }
        }
    </style>

<script id='loginScript'>// Toggle password visibility
var togglePassword = document.getElementById('togglePassword');
var passwordInput = document.getElementById('password');
var errorMessage = document.getElementById('errorMessage');
var loginForm = document.getElementById('loginForm');
togglePassword.addEventListener('click', function () {
  var type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
  passwordInput.setAttribute('type', type);

  // Toggle the eye icon
  togglePassword.querySelector('i').classList.toggle('fa-eye');
  togglePassword.querySelector('i').classList.toggle('fa-eye-slash');
});
// Form submission handling
loginForm.addEventListener('submit', function (e) {
  e.preventDefault();

  // Simple validation simulation
  var email = document.getElementById('email').value;
  var password = passwordInput.value;

  // In a real application, this would be an API call
  if (email && password) {
    // Hide error message if visible
    errorMessage.classList.add('hidden');

    // Simulate loading state
    var submitButton = loginForm.querySelector('button[type="submit"]');
    var originalText = submitButton.innerHTML;
    submitButton.disabled = true;
    submitButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

    // Simulate API delay
    setTimeout(function () {
      // In a real app, this would redirect to dashboard
      alert('Login functionality would be implemented here');
      submitButton.disabled = false;
      submitButton.innerHTML = originalText;
    }, 1500);
  } else {
    // Show error message
    errorMessage.classList.remove('hidden');
    // Add shake animation to error message
    errorMessage.classList.add('animate-shake');
    setTimeout(function () {
      errorMessage.classList.remove('animate-shake');
    }, 500);
  }
});
// Add shake animation for error feedback
var style = document.createElement('style');
style.textContent = "@keyframes shake {\n                0%, 100% { transform: translateX(0); }\n                20%, 60% { transform: translateX(-5px); }\n                40%, 80% { transform: translateX(5px); }\n            }\n            .animate-shake {\n                animation: shake 0.5s ease-in-out;\n            }";
document.head.appendChild(style);</script>
<!-- [/JSMOD] k2l_登录表单交互 -- 处理密码显示/隐藏切换、表单提交验证和错误反馈 -->
